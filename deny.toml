# cargo-deny: supply-chain policy for the whole workspace.
#   cargo deny check                       (full: advisories need the network)
#   cargo deny check bans licenses sources (offline subset run by scripts/gate.py)

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
ignore = [
  # smartstring, through rhai (the script sandbox): unmaintained, with no known
  # vulnerability and no release to move to; rhai is the one pure-Rust
  # embeddable language small enough for the engine.
  { id = "RUSTSEC-2026-0249", reason = "smartstring via rhai: unmaintained, no vulnerability, no replacement" },
]

[licenses]
version = 2
# Permissive licenses only: borer is MIT and ships as one static binary.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "NCSA",
  "Unlicense",
  # tiny-keccak, through rhai's compile-time hash seed: a public-domain dedication.
  "CC0-1.0",
  # yaxpeax-arm and yaxpeax-arch, the arm64 decoder: zero-clause BSD, more
  # permissive than MIT (no attribution required).
  "0BSD",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
  # the engine is sync and pure: no async runtime may leak into it (rules: critical)
  { crate = "tokio", wrappers = ["borer", "rmcp", "tokio-util"] },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
