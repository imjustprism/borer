name: fuzz

# libFuzzer over the loaders (PE, ELF, Mach-O with DWARF, minidump, raw),
# over load, analyze and decompile, over the carver, the `<file>@<offset>`
# loads and a companion PDB, and over project files and what reads the
# overlay they load: a minute per target on the way to main (its pull
# requests and pushes), ten minutes per target weekly.
# A target with a folder under fuzz/seeds starts from the inputs in it. An
# input that panics, runs past ten seconds or takes 2 GB fails the job and
# is uploaded; replay it with `cargo +nightly fuzz run <target> <file>` and
# keep it as a test. `pdb` runs only when asked for by name: from its seeds
# it finds within seconds a module whose line-program size passes its
# stream, which panics in the pdb crate, and it joins `all` with that fix.
# A manual run takes a target (every other one when not given), libFuzzer's seed
# and a run count (ten minutes when not given): the `INFO: Seed:` and
# `Done N runs` a run printed replay it on the same build, as far as the
# target is deterministic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: The target to fuzz; all fuzzes load, analyze, il, carve, nested and project in turn
        type: choice
        options: [all, load, analyze, il, carve, nested, project, pdb]
        default: all
      seed:
        description: libFuzzer's -seed; empty lets libFuzzer pick one
        type: string
        default: ""
      runs:
        description: libFuzzer's -runs, the inputs to try with no time limit; empty fuzzes for ten minutes
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly; a dated one keeps the build reproducible.
  NIGHTLY: nightly-2026-10-01
  SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 600 || 60 }}
  # Sanitizer reports name each frame's function, file and line, not an
  # offset into the binary.
  ASAN_OPTIONS: symbolize=1
  ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
  # LeakSanitizer passes over the one leak fuzz/lsan.supp names and explains
  # (a dependency's tables, built once); every other leak fails the run.
  LSAN_OPTIONS: suppressions=${{ github.workspace }}/fuzz/lsan.supp

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update

      - name: cargo-fuzz
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked

      # The runner image carries a versioned llvm-symbolizer with its clang;
      # the package index is asked only when it does not, three times, since
      # a mirror that does not resolve failed this step before any fuzzing.
      - name: llvm-symbolizer
        run: |
          if [ ! -x "$ASAN_SYMBOLIZER_PATH" ]; then
            have=$(ls /usr/bin/llvm-symbolizer-* /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$have" ]; then
              sudo ln -sf "$have" "$ASAN_SYMBOLIZER_PATH"
            else
              for attempt in 1 2 3; do
                sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends llvm && break
                sleep 30
              done
            fi
          fi
          "$ASAN_SYMBOLIZER_PATH" --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ inputs.target }}
          SEED: ${{ inputs.seed }}
          RUNS: ${{ inputs.runs }}
        run: |
          [[ "$SEED$RUNS" =~ ^[0-9]*$ ]] || { echo "seed and runs take digits only"; exit 1; }
          targets="load analyze il carve nested project"
          if [ "${TARGET:-all}" != all ]; then targets=$TARGET; fi
          stop=(-max_total_time="$SECONDS_PER_TARGET")
          if [ -n "$RUNS" ]; then stop=(-runs="$RUNS"); fi
          seed=()
          if [ -n "$SEED" ]; then seed=(-seed="$SEED"); fi
          for target in $targets; do
            mkdir -p "corpus/$target"
            corpus=("corpus/$target")
            if [ -d "seeds/$target" ]; then corpus+=("seeds/$target"); fi
            cargo +"$NIGHTLY" fuzz run "$target" "${corpus[@]}" -- \
              "${stop[@]}" "${seed[@]}" -timeout=10 -rss_limit_mb=2048
          done

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
