name: ci

# The project's own gate on Windows: the same `scripts/gate.py --check` a
# commit passes locally, so CI and the local gate cannot drift apart; and
# clippy and the tests on Linux and macOS. It runs on what lands on dev or
# main, on every pull request into main, and on demand; a newer run on the
# same ref cancels the older one.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: gate (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Full history: the gate's first step checks every commit message
      # since origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A pull request checks its own head, not the merge commit GitHub
          # synthesizes, whose title the message check would refuse.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # rust-toolchain.toml pins the channel and components; with no
      # argument rustup installs exactly that.
      - name: toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true

      - name: gate tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: typos@1.50.3,cargo-deny@0.20.2

      - name: ruff
        run: python -m pip install ruff==0.16.10

      # Advisories need the network, which the local gate does not assume.
      - name: advisories
        run: cargo deny check advisories

      # --check: verify only, and a tool the gate needs that is missing is
      # a failure here, never a skip.
      - name: gate
        run: python scripts/gate.py --check
        env:
          # Where the commits under test start: a pull request's base, or
          # the commit a push started from (empty on a manual run).
          BORER_COMMITS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The same workspace built, linted and tested on Linux and macOS, so an
  # assumption that only holds on Windows fails here. The tests that read
  # borer's own build pin it as the Windows x64 PE and are ignored off
  # Windows; macos-latest is Apple silicon, whose arm64 binaries borer
  # loads but does not disassemble. Doctests are left out for the same
  # reason: they decompile the running binary.
  portable:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --lib --bins --tests
