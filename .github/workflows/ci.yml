name: ci

# The project's own gate on Windows: the same `scripts/gate.py --check` a
# commit passes locally, so CI and the local gate cannot drift apart; clippy
# and the tests on Linux (x64 and arm64) and macOS (arm64); clippy on Windows
# arm64; the GPUI app's clippy and tests on Linux and macOS; and the RustSec
# advisories. Work on dev (its pull requests and pushes) runs only `quick`:
# format, lints, clippy and the commit messages, in minutes. The full set
# runs on a pull request into main, a push to main and a manual run, so main
# never moves without it; advisories also run weekly. A newer run on the
# same ref cancels the older one.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The fast checks every change on its way into dev passes: format, the
  # comment and spelling checks, Python lint, the size, path and duplicate
  # ratchets, clippy and the commit messages.
  quick:
    if: github.event_name != 'schedule' && !(github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: typos@1.50.3

      - name: format
        run: cargo fmt --all --check

      - name: commits
        run: python3 scripts/check/commits.py
        env:
          BORER_COMMITS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: comments
        run: python3 scripts/check/strip_comments.py --check

      - name: typos
        run: typos

      - name: ruff
        run: pipx run ruff==0.16.10 check scripts && pipx run ruff==0.16.10 format --check scripts

      - name: sizes
        run: python3 scripts/check/sizes.py

      - name: paths
        run: python3 scripts/check/paths.py

      - name: dupes
        run: python3 scripts/check/dupes.py

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Advisories need the network, which the local gate does not assume, and
  # a new one can land with no change here, hence the weekly run.
  advisories:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: advisories
        run: cargo deny check advisories

  # The gate in three parts side by side (`PARTS` in scripts/gate.py): the
  # checks and tests, the dogfood sweeps with the time bars, and the GPUI
  # app. Each check belongs to one part, so every check still runs once;
  # in one job they ran past the 2-hour limit.
  gate:
    name: gate (windows, ${{ matrix.part }})
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        part: [checks, sweeps, app]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Full history: the gate's first step checks every commit message
      # since origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A pull request checks its own head, not the merge commit GitHub
          # synthesizes, whose title the message check would refuse.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # rust-toolchain.toml pins the channel and components; with no
      # argument rustup installs exactly that.
      - name: toolchain
        run: rustup toolchain install --no-self-update

      # One cache per part: each builds its own profiles.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: true
          key: ${{ matrix.part }}

      - name: gate tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: typos@1.50.3,cargo-deny@0.20.2

      - name: ruff
        run: python -m pip install ruff==0.16.10

      # --check: verify only, and a tool the gate needs that is missing is
      # a failure here, never a skip.
      - name: gate
        run: python scripts/gate.py --check --part ${{ matrix.part }}
        env:
          # Where the commits under test start: a pull request's base, or
          # the commit a push started from (empty on a manual run).
          BORER_COMMITS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The same workspace built, linted and tested on Linux and macOS, x64 and
  # arm64 hosts, so an assumption that only holds on Windows or on x64 fails
  # here. The tests that read
  # borer's own build pin it as the Windows x64 PE and are ignored off
  # Windows, and macos-latest is Apple silicon, so the running test binary
  # is an arm64 Mach-O there. Doctests are left out for the same reason:
  # they decompile the running binary as the Windows x64 PE.
  portable:
    name: test (${{ matrix.os }})
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --lib --bins --tests

  # The GPUI app, its own workspace under app/ on its own toolchain, built,
  # linted and tested on Linux and macOS; the Windows gate runs it through
  # scripts/run/app.py. Its tests run on GPUI's test platform and headless
  # text systems, so no display server is needed; the ligature test runs
  # from its own main, since macOS builds its platform only on the main
  # thread. The Linux packages come from Zed's script/linux at the pinned
  # revision: the fontconfig, freetype, OpenSSL and X11/xkbcommon libraries
  # the native crates link, clang and CMake for the C they build (SQLite
  # and zstd build from source), and the Wayland and Vulkan libraries GPUI
  # loads at run time. macOS needs Xcode's Metal toolchain for GPUI's
  # shaders, which newer Xcodes download on demand.
  app:
    name: app (${{ matrix.os }})
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: linux packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake libfontconfig-dev libssl-dev libwayland-dev
          libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

      - name: metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      # The app's own channel, named for rust-cache too, which otherwise keys
      # on the root workspace's toolchain.
      - name: toolchain
        run: |
          rustup toolchain install --no-self-update
          echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # Windows on arm64: clippy compiles every target there, the C the
  # allocator builds included. The tests stay on x64 Windows, since the
  # ones that read borer's own build pin it as an x64 PE.
  windows-arm64:
    name: clippy (windows-11-arm)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
