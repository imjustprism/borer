name: release

# Builds the shipped binary (the `dist` profile) for four targets, packs
# each with LICENSE, NOTICE, README.md and the licenses of everything the
# binary links (THIRD-PARTY-LICENSES and RUST-STD-COPYRIGHT.html, written by
# scripts/dev/licenses.py for that target), and attaches the archives and their
# SHA-256 sums to the GitHub Release of a pushed `v*` tag. Run by hand on
# a branch, it builds and uploads the archives as workflow artifacts and
# publishes nothing; run by hand on a tag, it publishes that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # The oldest supported Ubuntu image, so the binary needs no newer
          # glibc than 2.35 (Ubuntu 22.04, Debian 12 and later run it).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-built on Apple silicon: the SDK carries both architectures.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel; the target is added to it.
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --locked --profile dist -p borer --target ${{ matrix.target }}

      # The licenses of the crates, the standard library and the C sources
      # this target's binary links; rust-docs (rust-toolchain.toml) holds the
      # standard library's texts.
      - name: third-party licenses
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/dev/licenses.py --target ${{ matrix.target }} --out THIRD-PARTY-LICENSES

      # The archive name: borer-<tag or branch>-<target>.
      - name: name
        shell: bash
        run: echo "NAME=borer-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME | Out-Null
          Copy-Item target/${{ matrix.target }}/dist/borer.exe, LICENSE, NOTICE, README.md, THIRD-PARTY-LICENSES, RUST-STD-COPYRIGHT.html -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"

      - name: package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp target/${{ matrix.target }}/dist/borer LICENSE NOTICE README.md THIRD-PARTY-LICENSES RUST-STD-COPYRIGHT.html "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The notes are the commit titles since the previous tag, grouped by their
      # type, newest first; --generate-notes lists only pull requests, and borer
      # lands without them.
      - name: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          git log --format=%s "$range" | awk '
            { t = $0; sub(/:.*/, "", t); s = $0; sub(/^[^:]*: /, "", s)
              s = toupper(substr(s, 1, 1)) substr(s, 2)
              k = (t == "add") ? "Added" : (t == "improve" || t == "perf") ? "Improved" : (t == "fix") ? "Fixed" : "Other"
              g[k] = g[k] "- " s "\n" }
            END { n = split("Added Improved Fixed Other", o, " ")
                  for (i = 1; i <= n; i++) if (g[o[i]] != "") printf "## %s\n%s\n", o[i], g[o[i]] }' > notes.md
          if [ -n "$prev" ]; then
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" >> notes.md
          fi

      - name: checksums
        working-directory: dist
        run: sha256sum borer-* > SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "borer $GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag
