name: release

# Builds the shipped binaries (the `dist` profile) for four targets, the
# server (borer-<tag>-<target>) and the desktop app (borer-app-<tag>-<target>),
# packs each with LICENSE, NOTICE, a README and the licenses of everything the
# binary links (THIRD-PARTY-LICENSES and RUST-STD-COPYRIGHT.html, written by
# scripts/dev/licenses.py for that target), adds the app's installers (an MSI
# on Windows, a .dmg holding borer.app on macOS; the Linux archive carries a
# desktop entry and icons), and attaches the archives, the installers and their
# SHA-256 sums to the GitHub Release of a pushed `v*` tag. From that release
# it then publishes the server to crates.io, npm and PyPI and updates the
# Homebrew tap and the Scoop bucket, each only when its credential is
# configured. Run by hand on a branch, it builds and uploads the archives as
# workflow artifacts and publishes nothing; run by hand on a tag, it publishes
# that tag. Run by hand with dev_build set, it builds the named ref and
# replaces the rolling `dev-build` pre-release with its archives instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dev_build:
        description: Publish the archives as the rolling dev-build pre-release
        type: boolean
        default: false
      ref:
        description: The branch, tag or commit a dev build builds
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.dev_build && 'dev-build' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The commit every build job checks out, so a branch that moves mid-run
  # cannot mix two commits in one release, and the archives' version: the
  # tag or branch, or `dev-build`. A dev build's ref is a branch, a tag or a
  # full or short commit, and must be on one of this repository's branches,
  # so a pull request's commit is refused.
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.dev_build && 0 || 1 }}
      - id: resolve
        env:
          DEV_BUILD: ${{ inputs.dev_build || false }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.dev_build && 'dev-build' || github.ref_name }}
        run: |
          sha=$GITHUB_SHA
          if [ "$DEV_BUILD" = true ]; then
            case "$REF" in
              "" | -*) echo "::error::ref '$REF' names no branch, tag or commit"; exit 1 ;;
            esac
            sha=$(git rev-parse --verify --quiet "refs/remotes/origin/$REF^{commit}" \
              || git rev-parse --verify --quiet "refs/tags/$REF^{commit}" \
              || git rev-parse --verify --quiet "$REF^{commit}") \
              || { echo "::error::ref '$REF' is no branch, tag or commit of this repository"; exit 1; }
            if [ -z "$(git branch -r --contains "$sha")" ]; then
              echo "::error::$sha is on no branch of this repository"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION//\//-}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # The oldest supported Ubuntu image, so the binary needs no newer
          # glibc than 2.35 (Ubuntu 22.04, Debian 12 and later run it).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-built on Apple silicon: the SDK carries both architectures.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}

      # rust-toolchain.toml pins the channel; the target is added to it.
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --locked --profile dist -p borer --target ${{ matrix.target }}

      # The licenses of the crates, the standard library and the C sources
      # this target's binary links; rust-docs (rust-toolchain.toml) holds the
      # standard library's texts.
      - name: third-party licenses
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/dev/licenses.py --target ${{ matrix.target }} --out THIRD-PARTY-LICENSES

      # The archive name: borer-<tag, branch or dev-build>-<target>.
      - name: name
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: echo "NAME=borer-$VERSION-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME | Out-Null
          Copy-Item target/${{ matrix.target }}/dist/borer.exe, LICENSE, NOTICE, README.md, THIRD-PARTY-LICENSES, RUST-STD-COPYRIGHT.html -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"

      - name: package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp target/${{ matrix.target }}/dist/borer LICENSE NOTICE README.md THIRD-PARTY-LICENSES RUST-STD-COPYRIGHT.html "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # The desktop app, from its own workspace and toolchain under app/. Linux
  # needs the libraries the app CI job installs; macOS needs Xcode's Metal
  # toolchain for GPUI's shaders. The installers are unsigned; the files they
  # use are under packaging/borer-app/.
  app:
    name: app (${{ matrix.target }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: linux packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake libfontconfig-dev libssl-dev libwayland-dev
          libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

      - name: metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      # app/rust-toolchain.toml pins the app's channel; rust-docs holds the
      # standard library's license texts.
      - name: toolchain
        working-directory: app
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup component add rust-docs
          rustup target add ${{ matrix.target }}

      - name: build
        working-directory: app
        run: cargo build --locked --profile dist -p borer-app --target ${{ matrix.target }}

      - name: third-party licenses
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/dev/licenses.py --app --target ${{ matrix.target }} --out THIRD-PARTY-LICENSES

      # The archive name, and the numeric version the MSI and borer.app need:
      # a `vX.Y.Z` tag's X.Y.Z, otherwise 0.0.<run number>.
      - name: name
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          echo "NAME=borer-app-$VERSION-${{ matrix.target }}" >> "$GITHUB_ENV"
          numeric=0.0.$GITHUB_RUN_NUMBER
          if [[ $VERSION =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then numeric=${BASH_REMATCH[1]}; fi
          echo "NUMERIC=$numeric" >> "$GITHUB_ENV"

      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME | Out-Null
          Copy-Item app/target/${{ matrix.target }}/dist/borer-app.exe, LICENSE, NOTICE, packaging/borer-app/README.md, THIRD-PARTY-LICENSES, RUST-STD-COPYRIGHT.html -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"

      - name: package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp app/target/${{ matrix.target }}/dist/borer-app LICENSE NOTICE packaging/borer-app/README.md THIRD-PARTY-LICENSES RUST-STD-COPYRIGHT.html "$NAME/"
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p "$NAME/share/applications"
            cp packaging/borer-app/borer-app.desktop "$NAME/share/applications/"
            for n in 16 32 48 64 128 256; do
              mkdir -p "$NAME/share/icons/hicolor/${n}x$n/apps"
              cp "packaging/borer-app/icons/$n.png" "$NAME/share/icons/hicolor/${n}x$n/apps/borer-app.png"
            done
          fi
          tar -czf "$NAME.tar.gz" "$NAME"

      # WiX v5 (MS-RL, no EULA to accept), pinned, into a tool path of its own.
      # The license page shows LICENSE as RTF. The MSI is then unpacked with an
      # administrative install, which installs nothing, to check it holds the app.
      - name: installer (msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "$env:RUNNER_TEMP/wix/wix.exe"
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $text = (Get-Content LICENSE -Raw) -replace '\\', '\\' -replace '\{', '\{' -replace '\}', '\}' -replace '\r?\n', "\par`n"
          Set-Content -Path "$env:NAME/LICENSE.rtf" -NoNewline -Value "{\rtf1\ansi\deff0{\fonttbl{\f0 Consolas;}}\fs16 $text}"
          & $wix build packaging/borer-app/borer-app.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$env:NUMERIC" -d "Dir=$env:NAME" -o "$env:NAME.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $image = "$env:RUNNER_TEMP/msi"
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$((Resolve-Path "$env:NAME.msi").Path)`"", '/qn', "TARGETDIR=`"$image`""
          if ($run.ExitCode) { exit $run.ExitCode }
          if (-not (Get-ChildItem $image -Recurse -Filter borer-app.exe)) { throw "the MSI holds no borer-app.exe" }

      # borer.app: the binary, Info.plist at the numeric version and the icon,
      # ad-hoc signed so the bundle is sealed, on a .dmg beside a link to
      # /Applications.
      - name: installer (dmg)
        if: runner.os == 'macOS'
        run: |
          root="$RUNNER_TEMP/dmg"
          app="$root/borer.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp app/target/${{ matrix.target }}/dist/borer-app "$app/MacOS/"
          cp packaging/borer-app/icons/borer-app.icns LICENSE NOTICE THIRD-PARTY-LICENSES RUST-STD-COPYRIGHT.html "$app/Resources/"
          sed "s/@VERSION@/$NUMERIC/g" packaging/borer-app/Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          codesign --force --sign - "$root/borer.app"
          codesign --verify --strict "$root/borer.app"
          cp LICENSE packaging/borer-app/README.md "$root/"
          ln -s /Applications "$root/Applications"
          hdiutil create -volname borer -srcfolder "$root" -fs HFS+ -format UDZO "$NAME.dmg"
          hdiutil verify "$NAME.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # The rolling preview, only by hand: the release and tag `dev-build` are
  # deleted and made again at the built commit, a pre-release that is never
  # the latest, once every server and app archive has built.
  dev-build:
    name: dev build
    needs: [source, build, app]
    if: ${{ inputs.dev_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum borer-* > SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.source.outputs.sha }}
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "An unreviewed preview build of \`$REF\` at commit $SHA, not a release."
            echo "Each dev build replaces the last; tagged releases are the reviewed ones."
          } > notes.md
          if ! err=$(gh release view dev-build --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            [[ $err == *"release not found"* ]] || { echo "$err" >&2; exit 1; }
          else
            gh release delete dev-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if ! err=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" 2>&1); then
            [[ $err == *"HTTP 404"* || $err == *"HTTP 422"* ]] || { echo "$err" >&2; exit 1; }
          fi
          gh release create dev-build dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "borer dev build" --notes-file notes.md \
            --prerelease --latest=false
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev-build" --jq .object.sha)
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::dev-build points at $tagged, not $SHA"
            exit 1
          fi

  # A failed app build leaves the server's release whole, without that archive.
  release:
    name: publish
    needs: [build, app]
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !inputs.dev_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The notes are the commit titles since the previous tag, grouped by their
      # type, newest first; --generate-notes lists only pull requests, and borer
      # lands without them.
      - name: notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          git log --format=%s "$range" | awk '
            { t = $0; sub(/:.*/, "", t); s = $0; sub(/^[^:]*: /, "", s)
              s = toupper(substr(s, 1, 1)) substr(s, 2)
              k = (t == "add") ? "Added" : (t == "improve" || t == "perf") ? "Improved" : (t == "fix") ? "Fixed" : "Other"
              g[k] = g[k] "- " s "\n" }
            END { n = split("Added Improved Fixed Other", o, " ")
                  for (i = 1; i <= n; i++) if (g[o[i]] != "") printf "## %s\n%s\n", o[i], g[o[i]] }' > notes.md
          if [ -n "$prev" ]; then
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" >> notes.md
          fi

      - name: checksums
        working-directory: dist
        run: sha256sum borer-* > SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "borer $GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag

  # Which package registries this repository may publish to. Each publish job
  # below runs only when its credential is configured (a secret, or for PyPI
  # the PYPI_PUBLISH variable saying its trusted publisher is registered), so a
  # release without them stays green with those jobs skipped.
  # packaging/SETUP.md lists what to create.
  registries:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.check.outputs.crates }}
      npm: ${{ steps.check.outputs.npm }}
      pypi: ${{ steps.check.outputs.pypi }}
      manifests: ${{ steps.check.outputs.manifests }}
    steps:
      - id: check
        env:
          CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          NPM: ${{ secrets.NPM_TOKEN != '' }}
          PYPI: ${{ vars.PYPI_PUBLISH == 'true' }}
          MANIFESTS: ${{ secrets.HOMEBREW_TAP_TOKEN != '' || secrets.SCOOP_BUCKET_TOKEN != '' }}
        run: |
          {
            echo "crates=$CRATES"
            echo "npm=$NPM"
            echo "pypi=$PYPI"
            echo "manifests=$MANIFESTS"
          } | tee -a "$GITHUB_OUTPUT"

  # crates.io, for `cargo install borer` and `cargo binstall borer` (which reads
  # [package.metadata.binstall] in crates/borer/Cargo.toml and fetches the
  # release archive). The engine and live crates go first: borer depends on them.
  crates:
    needs: registries
    if: ${{ !cancelled() && needs.registries.result == 'success' && needs.registries.outputs.crates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install --no-self-update
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p borer-engine -p borer-front -p borer-live -p borer

  # npm: @imjustprism/borer and its four platform packages (scripts/dev/packages.py).
  # The Linux pair is installed and run before anything is published; a
  # package whose version npm already has (a rerun) is left alone.
  npm:
    needs: registries
    if: ${{ !cancelled() && needs.registries.result == 'success' && needs.registries.outputs.npm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: packages
        run: python3 scripts/dev/packages.py npm dist npm
      - name: try
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm pack "$GITHUB_WORKSPACE/npm/@imjustprism/borer" "$GITHUB_WORKSPACE/npm/@imjustprism/borer-linux-x64"
          npm install --no-audit --no-fund ./imjustprism-borer-*.tgz
          npx --no-install borer --version
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          for dir in npm/@imjustprism/borer-*/ npm/@imjustprism/borer/; do
            spec=$(node -p "const p = require('./${dir}package.json'); p.name + '@' + p.version")
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish "$dir" --access public --provenance
            fi
          done

  # PyPI: the borer wheels (scripts/dev/packages.py), the Linux one installed
  # and run before anything is uploaded, through trusted
  # publishing, so no token: PyPI trusts this workflow in the `pypi`
  # environment once it is registered there as the project's publisher.
  pypi:
    needs: registries
    if: ${{ !cancelled() && needs.registries.result == 'success' && needs.registries.outputs.pypi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: wheels
        run: python3 scripts/dev/packages.py wheels dist wheels
      - name: try
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index wheels/borer-*-manylinux_*_x86_64.whl
          "$RUNNER_TEMP/venv/bin/borer" --version
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels
          skip-existing: true

  # The Homebrew formula and the Scoop manifest, committed to the tap and the
  # bucket repositories; either is skipped while its token is not set.
  manifests:
    needs: registries
    if: ${{ !cancelled() && needs.registries.result == 'success' && needs.registries.outputs.manifests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --pattern SHA256SUMS
          python3 scripts/dev/packages.py manifests dist out
      - name: push
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          push() {
            local repo=$1 token=$2 from=$3 to=$4 dir="$RUNNER_TEMP/$1"
            if [ -z "$token" ]; then echo "$repo: no token, skipped"; return; fi
            git clone -q --depth 1 "https://x-access-token:$token@github.com/imjustprism/$repo.git" "$dir"
            mkdir -p "$(dirname "$dir/$to")"
            cp "$from" "$dir/$to"
            git -C "$dir" add "$to"
            if git -C "$dir" diff --cached --quiet; then
              echo "$repo: $to is already current"
              return
            fi
            git -C "$dir" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "borer ${GITHUB_REF_NAME#v}"
            git -C "$dir" push -q origin HEAD
          }
          push homebrew-tap "$TAP_TOKEN" out/homebrew/borer.rb Formula/borer.rb
          push scoop-bucket "$BUCKET_TOKEN" out/scoop/borer.json bucket/borer.json
