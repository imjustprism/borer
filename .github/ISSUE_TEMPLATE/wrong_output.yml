name: Wrong answer
description: A decompile, a type, a count or a claim that does not match the binary.
labels: [bug, wrong output]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The CLI command or MCP tool call, with its arguments.
      render: text
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What borer said
      description: The lines that are wrong, with the `// checked vs binary` header line if the decompile has one.
      render: text
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What is true, and how you know
      description: >
        The disassembly, a run (`borer run`, `borer emulate`), the source, or another tool's answer.
        `borer certify <binary> <function>` and `borer blame <binary> <function>` say whether borer
        itself sees the difference; paste their output if you have it.
      render: text
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: The binary
      description: >
        Format, architecture and compiler if you know them. Attach or link
        the file only if you are allowed to share it; a small program that
        reproduces the problem is even better. For malware, give its SHA-256
        and a public source instead of attaching it.
  - type: dropdown
    id: front
    attributes:
      label: How you ran it
      options:
        - Command line
        - MCP server, driven by an agent
  - type: input
    id: version
    attributes:
      label: borer version
      description: The first line of `borer doctor offline`.
    validations:
      required: true
