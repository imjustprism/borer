# Monthly, one grouped pull request per ecosystem, so updates arrive as a
# single gate run each instead of a stream of one-line bumps. The `chore`
# prefix gives each pull request a title in the project's commit format.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: chore
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
