[package]
name = "borer-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only access to a running process for borer's live view: attach, modules, regions, memory."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
borer-engine = { version = "0.2.1", path = "../borer-engine" }
# the allocator borer links (through mimalloc): its `mi_collect` hands free
# memory back ([`release_free_memory`])
libmimalloc-sys = "0.1.49"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
