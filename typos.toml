# typos (https://github.com/crate-ci/typos): spelling in code, docs, comments.
[files]
extend-exclude = [
  "target/",
  "Cargo.lock",
  # hashes of decompiled texts, not words
  "scripts/run/golden.tsv",
  # API and type names generated from the Windows SDK headers, not prose
  "crates/borer-engine/src/analysis/sdk/*.tsv",
]

[default]
# hex byte strings ("fe dc ba 98") are data, not words, and so is the
# commit the benchmark records ("borerCommit": "321abd71")
extend-ignore-re = [
  "(?i)\\b[0-9a-f]{2}( [0-9a-f]{2}){3,}\\b",
  "\"borerCommit\": \"[0-9a-f]+\"",
]

[default.extend-words]
# the transposed name (WinMian for WinMain) the name suggestions are tested with
Mian = "Mian"
# ELF relocation sections (.rela.plt) and Windows structured exception handling.
rela = "rela"
# the DWARF address-range section is spelled .debug_aranges
aranges = "aranges"
# the Windows UNICODE_STRING types (PUNICODE_STRING), as winnt.h spells them
PUNICODE = "PUNICODE"
seh = "seh"
SEH = "SEH"
# plural of `va` (virtual address), used throughout the tests
vas = "vas"
# a Windows DLL (AcGenral.dll) that is spelled that way
Genral = "Genral"
# the x86 `setp` (set if parity) mnemonic, and `andn`, which ands
setp = "setp"
ands = "ands"
# Qt's Q_INVOKABLE macro, which moc metadata names
INVOKABLE = "INVOKABLE"
# the CRT's x87 helper _ftol2_sse_excpt, spelled that way
excpt = "excpt"
# OLE Automation's UDATE, in oleaut32's VarDateFromUdate
Udate = "Udate"
# Arm's Scalable Matrix Extension, an arm64 encoding space
SME = "SME"
Sme = "Sme"
sme = "sme"

[default.extend-identifiers]
# clang's JSON AST node kind for a function parameter
ParmVarDecl = "ParmVarDecl"
# the Windows kernel's I/O manager call, as wdm.h spells it
IofCallDriver = "IofCallDriver"
# Arm EABI runtime helpers, as the ABI names them
__aeabi_d2iz = "__aeabi_d2iz"
__aeabi_d2uiz = "__aeabi_d2uiz"
__aeabi_lasr = "__aeabi_lasr"
# iced-x86 operand kind
Immediate8_2nd = "Immediate8_2nd"
# the x86 BCD adjust mnemonics, as iced-x86 spells them
Daa = "Daa"
Das = "Das"
Aaa = "Aaa"
Aas = "Aas"
Aad = "Aad"
Aam = "Aam"
Setp = "Setp"
# LLVM's ordered less-than float compare predicate (`fcmp olt`)
Olt = "Olt"
