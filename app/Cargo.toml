# Windows build prerequisites for `borer-app`:
# - MSVC C++ x64 build tools (`link.exe` / Windows import libraries; `../.cargo/config.toml` selects `rust-lld`).
# - Windows 10/11 SDK 10.0.20348 or newer (`rc.exe` embeds the manifest in `gpui_platform`; `fxc.exe` compiles
#   DirectX HLSL shaders in release builds of `gpui_windows`, overridable via `GPUI_FXC_PATH`).
# - Rust toolchain 1.98.1 (`rustup toolchain install 1.98.1 --profile minimal -c rustfmt -c clippy`).
# - `git` and ~0.6 GB in Cargo's git cache for the pinned Zed checkout (`v1.28.1`). CMake is not needed.

[workspace]
resolver = "2"
members = ["borer-app"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/imjustprism/borer"
publish = false

[workspace.dependencies]
anyhow = "1"
assets = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
borer-engine = { path = "../crates/borer-engine" }
borer-front = { path = "../crates/borer-front" }
client = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
clock = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
collections = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
command_palette = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
command_palette_hooks = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
db = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
dirs = "6"
# The icon resource of borer-app.exe (borer-app/build.rs), at the version gpui embeds its manifest with.
embed-resource = "3.0.12"
editor = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
fs = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
futures = "0.3.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", default-features = false, features = ["font-kit", "wayland", "x11"] }
http_client = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Decodes the X11 window icon, at the version and with a feature gpui already builds.
image = { version = "0.25.10", default-features = false, features = ["png"] }
language = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
lsp = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
menu = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
node_runtime = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
paths = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
picker = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
platform_title_bar = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
project = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
search = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Counts a theme family's themes before parsing them, in the lenient JSON Zed's themes are written in.
serde_json_lenient = "0.2"
session = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
settings = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# The row depths Zed's indent guides take.
smallvec = "1"
theme = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
ui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
ui_input = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Embeds Zed's settings, keymaps and assets in debug and test builds too, which otherwise
# read them from a Zed checkout at run time and find none in this repository.
util = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["debug-embed"] }
workspace = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
zed_actions = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
non_ascii_idents = "deny"
unit_bindings = "warn"
redundant_lifetimes = "warn"
meta_variable_misuse = "warn"
unused_import_braces = "warn"
explicit_outlives_requirements = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
private_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unreadable_literal = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
items_after_statements = "allow"
single_match_else = "allow"
match_same_arms = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
float_cmp = "allow"
format_push_string = "allow"
format_collect = "allow"
verbose_bit_mask = "allow"
option_option = "allow"
struct_field_names = "allow"
naive_bytecount = "allow"
case_sensitive_file_extension_comparisons = "allow"
assigning_clones = "allow"
trivially_copy_pass_by_ref = "allow"
self_only_used_in_recursion = "allow"
decimal_bitwise_operands = "allow"
manual_assert = "allow"
needless_for_each = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unnecessary_safety_doc = "warn"
doc_markdown = "warn"
doc_link_with_quotes = "warn"
doc_lazy_continuation = "warn"
too_long_first_doc_paragraph = "warn"
empty_docs = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
tabs_in_doc_comments = "warn"
suspicious_doc_comments = "warn"
needless_doctest_main = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
get_unwrap = "deny"
exit = "deny"
mem_forget = "deny"
infinite_loop = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
fn_to_numeric_cast_any = "deny"
float_cmp_const = "deny"
suspicious_xor_used_as_pow = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
print_stdout = "deny"
iter_over_hash_type = "deny"
host_endian_bytes = "deny"
redundant_clone = "warn"
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
str_to_string = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
if_not_else = "warn"
unnested_or_patterns = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
needless_continue = "warn"
unused_self = "warn"
ref_option = "warn"
return_self_not_must_use = "warn"
inconsistent_struct_constructor = "warn"
large_types_passed_by_value = "warn"
needless_raw_strings = "warn"
redundant_type_annotations = "warn"
deref_by_slicing = "warn"
equatable_if_let = "warn"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.iced-x86]
overflow-checks = false

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# The shipped app, as the root workspace's dist profile builds the server:
# everything release does, plus no symbols.
[profile.dist]
inherits = "release"
panic = "unwind"
strip = true
