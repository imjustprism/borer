# cargo-deny: supply-chain and license policy for the `borer-app` GPUI workspace.
#   cargo deny check                       (full: advisories need the network)
#   cargo deny check bans licenses sources (offline subset run by scripts/run/app.py)

[graph]
# Every host the app ships on, so each platform's crates, sources and licenses are checked.
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
ignore = [
  # smartstring, through rhai (the engine's script sandbox): unmaintained, with
  # no known vulnerability and no release to move to.
  { id = "RUSTSEC-2026-0249", reason = "smartstring via rhai: unmaintained, no vulnerability, no replacement" },
  # rustybuzz 0.20.1, through usvg -> gpui (bundled SVG icon shaping): unmaintained,
  # no vulnerability, pinned by Zed v1.28.1's resvg/usvg version.
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz via usvg/gpui: unmaintained, no vulnerability, pinned by Zed v1.28.1" },
  # ttf-parser 0.25.1, through gpui and usvg/fontdb: unmaintained, no vulnerability,
  # pinned by Zed v1.28.1.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via gpui/usvg: unmaintained, no vulnerability, pinned by Zed v1.28.1" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "deny"
allow = [
  # Standard permissive Rust ecosystem crates across engine and GPUI dependencies.
  "MIT",
  # GPUI core crates (`gpui`, `gpui_platform`, `gpui_windows`, `sum_tree`, `collections`, etc.) and Rust ecosystem crates.
  "Apache-2.0",
  # BSD-2-Clause crates (`arrayref`, `mach2`, `zerocopy`, font/text helpers).
  "BSD-2-Clause",
  # BSD-3-Clause crates (`subtle`, `instant`, `skrifa`/`read-fonts` tables, cryptography/compression helpers).
  "BSD-3-Clause",
  # Unicode data tables (`icu_*`, `unicode-ident`).
  "Unicode-3.0",
  # Zlib-licensed crates (`foldhash`, `miniz_oxide`, `tinyvec`, graphics/windowing helpers).
  "Zlib",
  # `webpki-roots` / Mozilla-derived crates (`option-ext`).
  "MPL-2.0",
  # Public-domain / Unlicense crates (`byteorder`, `memchr`, `aho-corasick`, `same-file`, `winapi-util`).
  "Unlicense",
  # `tiny-keccak` via `rhai`: public-domain dedication.
  "CC0-1.0",
  # `yaxpeax-arm` and `yaxpeax-arch` in `borer-engine`: zero-clause BSD.
  "0BSD",
  # Zed UI and theme crates (`ui`, `ui_macros`, `theme`, `syntax_theme`, `component`, `icons`, `menu`, `refineable`).
  "GPL-3.0-or-later",
  # `borer-app` and `borer-engine` themselves.
  "AGPL-3.0-only",
  # Zed's `language_core` and `grammars`, whose license file reads as the older `GPL-3.0` id;
  # compatible with the app's AGPL-3.0-only under section 13 of each.
  "GPL-3.0",
  # `wasmtime`, `cranelift-*`, `pulley-*`, `regalloc2`, `target-lexicon`, `psm`, `stacker`:
  # `language` turns on tree-sitter's `wasm` feature unconditionally, so it cannot be dropped.
  "Apache-2.0 WITH LLVM-exception",
  # `rustls-webpki`, `untrusted`, `aws-lc-rs`, `aws-lc-sys` (Zed's TLS stack under `client`).
  "ISC",
  # `aws-lc-sys` (part of its license expression).
  "MIT-0",
  # `xxhash-rust` via Zed's `notify` fork under `fs`.
  "BSL-1.0",
  # `webpki-roots` via `http_client_tls` under `client`.
  "CDLA-Permissive-2.0",
  # `libbz2-rs-sys` via `bzip2` under `compression-codecs`.
  "bzip2-1.0.6",
]

[licenses.private]
# Zed's git crates set `publish = false`; `ignore = false` forces cargo-deny to verify every git crate's license.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Zed's workspace pulls its HTTP client, RPC client and TLS stack (`client`, `http_client`,
# `rustls`, `hyper`, `tokio`), which the app never starts: it boots with Zed's
# `BlockedHttpClient` and never calls `client::init`. The crates that would update,
# report crashes or join calls stay out of the graph.
deny = [
  { crate = "auto_update", reason = "the app never updates itself through Zed" },
  { crate = "auto_update_helper", reason = "the app never updates itself through Zed" },
  { crate = "crashes", reason = "the app sends no crash reports" },
  { crate = "livekit_client", reason = "the app joins no calls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # Zed `v1.28.1` (`gpui`, `ui`, `workspace`, `editor`, `command_palette` and their workspace dependencies).
  "https://github.com/zed-industries/zed",
  # Zed's tested `async-task` patch (one commit over upstream for waker vtable identity).
  "https://github.com/zed-industries/async-task",
  # Zed's `calloop` patch at the pin's rev: `gpui_linux` (the `wayland` and `x11`
  # features of `gpui_platform`) builds against it, so `Cargo.lock` resolves it for
  # Linux even though the Windows graph checked above never compiles it.
  "https://github.com/zed-industries/calloop",
  # Zed's patches of `async-process` and `notify` (`fs` watches through it), and the
  # tree-sitter revision Zed unifies `tree-sitter-language` on (`language`).
  "https://github.com/zed-industries/async-process",
  "https://github.com/zed-industries/notify",
  "https://github.com/tree-sitter/tree-sitter",
  # Zed's forks its workspace's `project`, `lsp`, `dap`, `fs` and `node_runtime` build on:
  # `alacritty_terminal` (`terminal`), `async-pipe`, `async-tar`, `dap-types`,
  # `lsp-types` and `trash`.
  "https://github.com/zed-industries/alacritty",
  "https://github.com/zed-industries/async-pipe-rs",
  "https://github.com/zed-industries/async-tar",
  "https://github.com/zed-industries/dap-types",
  "https://github.com/zed-industries/lsp-types",
  "https://github.com/zed-industries/trash-rs",
  # The grammars `language`'s test support loads, for the app's tests.
  "https://github.com/zed-industries/tree-sitter-markdown",
  "https://github.com/zed-industries/tree-sitter-typescript",
  # The wgpu revision Zed pins (`wgpu`, `wgpu-core`, `wgpu-hal`, `naga`): `gpui_wgpu`
  # renders with it on Linux.
  "https://github.com/gfx-rs/wgpu",
  # Zed's forks the Linux and macOS platforms build on: `zed-font-kit` (font lookup on
  # macOS), `oo7` (the Secret Service keyring on Linux) and `zed-xim` (X11 input methods).
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/oo7",
  "https://github.com/zed-industries/xim-rs.git",
]
