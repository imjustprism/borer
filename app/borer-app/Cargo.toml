[package]
name = "borer-app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Desktop GPUI application over borer-engine"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
anthropic.workspace = true
assets.workspace = true
borer-engine.workspace = true
borer-front.workspace = true
client.workspace = true
clock.workspace = true
collections.workspace = true
command_palette.workspace = true
command_palette_hooks.workspace = true
credentials_provider.workspace = true
db.workspace = true
dirs.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
google_ai.workspace = true
http_client.workspace = true
image.workspace = true
language.workspace = true
language_model.workspace = true
lsp.workspace = true
markdown.workspace = true
menu.workspace = true
node_runtime.workspace = true
open_ai.workspace = true
paths.workspace = true
picker.workspace = true
platform_title_bar.workspace = true
project.workspace = true
reqwest_client.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
session.workspace = true
settings.workspace = true
smallvec.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
ui_input.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zed_credentials_provider.workspace = true

[build-dependencies]
# Compiles the icon resource (build.rs); gpui already builds it to embed its manifest.
embed-resource.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# Builds the profiler histograms gpui reports, at the version and features gpui uses.
hdrhistogram = { version = "7", default-features = false }
http_client = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

# The real platform's shaper, which macOS builds only on the main thread: run from `main`.
[[test]]
name = "ligature"
harness = false
